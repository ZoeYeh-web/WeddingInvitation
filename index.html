<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jim & Zoe 婚禮盛宴</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d49373; /* 香檳金 */
            --bg-color: #fdf7f7;     /* 暖白 */
            --accent-pink: #f2e1e1;  /* 淡雅粉 */
            --text-color: #5a5a5a;
            --gold-gradient: linear-gradient(135deg, #d4a373 0%, #faedcd 50%, #d4a373 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif TC', serif;
            color: var(--text-color);
            background: var(--bg-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 花瓣飄落動畫背景 */
        #petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background-color: var(--accent-pink);
            border-radius: 150% 0 150% 0;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* 封面 */
        .cover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle, #fff 0%, var(--accent-pink) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1), opacity 1s;
            text-align: center;
        }

        .cover-overlay.hide {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .envelope-icon {
            font-size: 50px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
            cursor: pointer;
        }

        .cover-title {
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .btn-open {
            background: var(--gold-gradient);
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
            transition: 0.3s;
        }

        .btn-open:hover {
            transform: scale(1.05);
        }

        /* 內容容器 */
        .main-content {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            opacity: 0;
            transform: translateY(50px);
            transition: 1.5s ease-out;
        }

        .main-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 163, 115, 0.2);
            padding: 40px 30px;
            margin-bottom: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 15px;
            pointer-events: none;
        }

        /* 主橫幅照片 */
        .hero-photo {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 163, 115, 0.1);
        }

        .names {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .divider {
            width: 50px;
            height: 2px;
            background: var(--primary-color);
            margin: 20px auto;
        }

        .wedding-info {
            line-height: 2;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .wedding-date {
            font-weight: bold;
            color: #b08d57;
            font-size: 1.3rem;
            margin: 15px 0;
        }

        /* 照片展示區 */
        .photo-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 40px 0;
        }

        .polaroid {
            background: white;
            padding: 15px 15px 40px 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: rotate(-2deg);
            transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 0;
            transform: translateY(40px);
        }

        .polaroid.visible {
            opacity: 1;
            transform: translateY(0) rotate(var(--rot));
        }

        .polaroid img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #eee;
        }

        /* 表單區域 */
        .form-section h3 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .iframe-wrapper {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 音樂播放按鈕 */
        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 200;
            border: 1px solid var(--accent-pink);
        }

        .music-toggle.playing {
            animation: rotate 3s linear infinite;
        }

        .hero-photo {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 動畫 */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* 響應式 */
        @media (max-width: 480px) {
            .names { font-size: 2.2rem; }
            .cover-title { font-size: 1.2rem; }
            .hero-photo { height: 180px; }
        }
    </style>
</head>
<body>

    <!-- 花瓣動畫層 -->
    <div id="petal-container"></div>

    <!-- 音樂控制 (預設靜音，可換成您的 MP3 連結) -->
    <div class="music-toggle" id="musicBtn" onclick="toggleMusic()">🎵</div>
    <audio id="bgMusic" loop>
        <source src="Beautiful Wedding - Cinematic Background Music For Videos.mp3" type="audio/mpeg">
    </audio>

    <!-- 封面遮罩 -->
    <div class="cover-overlay" id="cover">
        <div class="envelope-icon" onclick="openInvitation()">💌</div>
        <div class="cover-title">Wedding Invitation</div>
        <div style="margin-bottom: 30px; font-size: 0.9rem; color: #888;">誠摯邀請您開啟這份幸福</div>
        <button class="btn-open" onclick="openInvitation()">開啟喜帖</button>
    </div>

    <!-- 喜帖主體 -->
    <div class="main-content" id="content">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80"  alt="婚禮主圖" class="hero-photo">
            <div style="font-size: 0.9rem; letter-spacing: 3px;">OUR WEDDING DAY</div>
            <div class="names">濬哲 💞 若儀</div>
            <div class="divider"></div>
            <div class="wedding-info">
                親愛的朋友與家人：<br>
                在眾人的見證與祝福下<br>
                我們決定攜手邁向人生的新篇章<br>
                誠摯邀請您蒞臨，分享我們的喜悅
            </div>
            
            <div class="wedding-date">
                2026.11.28 Saturday
            </div>
            
            <div class="wedding-info">
                11:30 入席 | 12:00 開席<br>
                <strong>晶麒莊園 </strong><br>
                桃園市平鎮區復旦路四段116巷51號
            </div>
            <img src="..\晶麒莊園交通資訊卡01_0.jpg" alt="婚禮地點" class="hero-photo">
            <img src="..\晶麒莊園交通資訊卡02_0.jpg" alt="婚禮地點" class="hero-photo">
        </div>

        <div class="card form-section">
            <h3>出席回覆</h3>
            <p style="font-size: 0.9rem; margin-bottom: 20px;">請於 2026/11/14 前填寫完成</p>
            <div class="iframe-wrapper">
                <!-- 請替換成您的 Google 表單連結 -->
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfmFK7nfGpXXslhN4RAQ6s27-l_Ox5J9MC_30AeW6SJKspd5w/viewform?usp=headere">載入中…</iframe>
            </div>
        </div>
        
        <div style="text-align: center; color: var(--primary-color); font-size: 0.8rem; margin-bottom: 40px;">
            With Love, Jim & Zoe
        </div>
    </div>

    <script>
        // 開啟喜帖功能
        function openInvitation() {
            const cover = document.getElementById('cover');
            const content = document.getElementById('content');
            
            cover.classList.add('hide');
            content.classList.add('show');

            // 嘗試自動播放音樂 (受瀏覽器安全限制，可能需要手動觸發)
            const music = document.getElementById('bgMusic');
            music.play().then(() => {
                document.getElementById('musicBtn').classList.add('playing');
            }).catch(() => {
                console.log('音樂自動播放被攔截，請點擊按鈕開啟');
            });
            
            // 延遲發動內容動畫，讓過場更順暢
            setTimeout(() => {
                window.scrollTo(0, 0);
                handleScroll(); // 開啟後檢查一次照片是否可見
            }, 500);
        }

        // 音樂控制開關
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicBtn');
            if (music.paused) {
                music.play();
                btn.classList.add('playing');
            } else {
                music.pause();
                btn.classList.remove('playing');
            }
        }

        // 處理捲動顯示照片
        function handleScroll() {
            const polaroids = document.querySelectorAll('.polaroid');
            polaroids.forEach(p => {
                const rect = p.getBoundingClientRect();
                if (rect.top < window.innerHeight * 0.9) {
                    p.classList.add('visible');
                }
            });
        }

        window.addEventListener('scroll', handleScroll);

        // 生成隨機飄落花瓣
        function createPetals() {
            const container = document.getElementById('petal-container');
            const petalCount = 15;

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                
                // 隨機屬性
                const size = Math.random() * 10 + 10 + 'px';
                const left = Math.random() * 100 + 'vw';
                const duration = Math.random() * 5 + 7 + 's';
                const delay = Math.random() * 5 + 's';
                
                petal.style.width = size;
                petal.style.height = size;
                petal.style.left = left;
                petal.style.animationDuration = duration;
                petal.style.animationDelay = delay;
                
                container.appendChild(petal);
            }
        }

        // 初始化
        window.onload = function() {
            createPetals();
        };
    </script>
</body>
</html>
